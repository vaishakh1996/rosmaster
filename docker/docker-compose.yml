
services:
  manipulation:
    container_name: manipulation_cpu
    image: rosmaster:humble-cpu-only

    build:
      context: ..
      dockerfile: docker/Dockerfile

    network_mode: host

    environment:
      ROS_DOMAIN_ID: "42"
      ROS_LOCALHOST_ONLY: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"

    volumes:
      - ../:/home/rosmaster/ros2_ws/src:rw

    working_dir: /home/rosmaster/ros2_ws

    stdin_open: true
    tty: true

    command: ["tail", "-f", "/dev/null"]
