services:
  manipulation:
    container_name: manipulation_cpu
    image: rosmaster:humble-cpu-only

    build:
      context: ..
      dockerfile: docker/Dockerfile

    network_mode: host

    environment:
      ROS_DOMAIN_ID: "42"
      ROS_LOCALHOST_ONLY: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      DISPLAY: ${DISPLAY:?DISPLAY must be set}
      XAUTHORITY: /tmp/rosmaster-xauthority
      XDG_RUNTIME_DIR: /tmp/runtime-1000

    volumes:
      - ../:/home/rosmaster/ros2_ws/src:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY:?XAUTHORITY must be set}:/tmp/rosmaster-xauthority:ro

    working_dir: /home/rosmaster/ros2_ws

    stdin_open: true
    tty: true

    command: ["tail", "-f", "/dev/null"]
